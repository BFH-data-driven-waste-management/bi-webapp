<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 auto-rows-fr gap-6
    [&>*]:h-full
    [&_.p-card]:h-full
    [&_.p-card]:rounded-2xl
    [&_.p-card]:border
    [&_.p-card]:border-surface-300">

  <app-simple-metric-card
    header="Installierte Eimer"
    icon="trash"
    [loading]="loading()"
    [value]="dashboardData()?.installedBins?.total" />

  <p-card header="Eimertyp-Verteilung" class="rounded-lg">
    @if (loading()) {
      <div class="px-4 pt-4">
        <p-skeleton width="100%" height="16rem" />
      </div>
    } @else {
      <p-chart class="relative h-64 mt-4" type="bar" [data]="barData()" [options]="barOptions" />
    }
  </p-card>

  <app-trend-metric-card
    header="Besuche (7d)"
    [loading]="loading()"
    [value]="dashboardData()?.visits7d?.value"
    [trendValue]="dashboardData()?.visits7d?.deltaRelative ?? 0"/>

  <app-trend-metric-card
    header="Leerungen (7d)"
    [loading]="loading()"
    [value]="dashboardData()?.emptyings7d?.value"
    [trendValue]="dashboardData()?.emptyings7d?.deltaRelative ?? 0"/>

  <app-trend-metric-card
    header="Leerungsquote (7d)"
    [loading]="loading()"
    [value]="dashboardData()?.emptyingRate7d?.value"
    [percent]="true"
    [trendValue]="dashboardData()?.emptyingRate7d?.deltaRelative ?? 0"/>

  <app-trend-metric-card
    header="Anteil Besuche mit niedrigem Füllstand (90d)"
    [loading]="loading()"
    [value]="dashboardData()?.lowFillVisitShare90d?.value"
    [percent]="true"
    [trendValue]="dashboardData()?.lowFillVisitShare90d?.deltaRelative ?? 0"/>

  <app-trend-metric-card
    header="Anteil Leerungen mit niedrigem Füllstand (90d)"
    [loading]="loading()"
    [value]="dashboardData()?.lowFillEmptyingShare90d?.value"
    [percent]="true"
    [trendValue]="dashboardData()?.lowFillEmptyingShare90d?.deltaRelative ?? 0"/>

  <app-simple-metric-card
    header="Übervolle Mülleimer (30d)"
    icon="exclamation-circle"
    [loading]="loading()"
    [value]="dashboardData()?.overfullEvents30d?.value"/>
</div>
