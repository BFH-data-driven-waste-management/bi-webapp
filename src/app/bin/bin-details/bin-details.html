<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-6
    [&_.p-card]:rounded-2xl
    [&_.p-card]:border
    [&_.p-card]:border-surface-300">

  <p-card header="Füllstände" class="col-span-full">
    <p-chart
      type="line"
      [data]="fillLevelData()"
      [options]="fillLevelOptions"
      class="h-64 mt-2" />
  </p-card>

  <p-card>
    <div class="flex flex-col gap-3">
      <div class="flex flex-col">
        <strong>Typ</strong>
        <span>{{ bin().type }}</span>
      </div>

      <div class="flex flex-col">
        <strong>Koordinaten</strong>

        <div class="flex gap-3">
          <div>
            <strong>X:</strong><span class="ml-1">{{ bin().coordX }}</span>
          </div>
          <div>
            <strong>Y:</strong><span class="ml-1">{{ bin().coordY }}</span>
          </div>
        </div>
      </div>
    </div>
  </p-card>

  <p-card header="Standort">
    <div class="h-64">
      <google-map
        height="100%"
        width="100%"
        [center]="binPosition()"
        [options]="mapOptions">
        <map-advanced-marker
          [position]="binPosition()"/>
      </google-map>
    </div>
  </p-card>

  <p-card header="Wetter Sensitivität">
    <div class="relative min-h-56">
      <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
        <div class="mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-red-500/15">
          <i class="pi pi-sun text-3xl text-red-400"></i>
        </div>

        <div class="text-6xl font-extrabold leading-none tracking-tight">
          0,77
        </div>
      </div>
    </div>
  </p-card>

  <p-card header="Event Sensitivtät">
    <div class="relative min-h-56">
      <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
        <div class="mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-red-500/15">
          <i class="pi pi-calendar text-3xl text-red-400"></i>
        </div>

        <div class="text-6xl font-extrabold leading-none tracking-tight">
          0,23
        </div>
      </div>
    </div>
  </p-card>
</div>
