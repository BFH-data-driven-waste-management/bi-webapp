<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 auto-rows-fr gap-6
    [&_.p-card]:h-full
    [&_.p-card]:rounded-2xl
    [&_.p-card]:border
    [&_.p-card]:border-surface-300">

  <p-card header="Füllstände" class="col-span-full">
    <p-chart
      type="line"
      [data]="fillLevelData()"
      [options]="fillLevelOptions"
      class="h-64 mt-2" />
  </p-card>

  <p-card>
    <div class="flex flex-col gap-3">
      <div class="flex flex-col">
        <strong>Typ</strong>
        <span>{{ bin().type }}</span>
      </div>

      <div class="flex flex-col">
        <strong>Koordinaten</strong>

        <div class="flex gap-3">
          <div>
            <strong>X:</strong><span class="ml-1">{{ bin().coordX }}</span>
          </div>
          <div>
            <strong>Y:</strong><span class="ml-1">{{ bin().coordY }}</span>
          </div>
        </div>
      </div>
    </div>
  </p-card>

  <p-card header="Standort">
    <div class="h-64">
      <google-map
        height="100%"
        width="100%"
        [center]="binPosition()"
        [options]="mapOptions">
        <map-advanced-marker
          [position]="binPosition()"/>
      </google-map>
    </div>
  </p-card>

  <app-icon-value-card
    header="⌀ wöchentliche Besuche (letzte 90 Tage)"
    value="3,14"
    secondaryIcon="arrow-up-right"
    secondaryValue="+3.2%"/>

  <app-icon-value-card
    header="⌀ wöchentliche Leerungen (letzte 90 Tage)"
    value="1,23"
    secondaryIcon="arrow-up-right"
    secondaryValue="+2.7%"/>

  <app-icon-value-card
    header="Rang nach Leerungen (letzte 90 Tage)"
    icon="list"
    value="2" />

  <app-icon-value-card
    header="Wetter Sensitivität"
    icon="sun"
    value="0,77" />

  <app-icon-value-card
    header="Event Sensitivtät"
    icon="calendar"
    value="0,23" />

  <app-icon-value-card
    header="Anteil Besuche mit niedrigem Füllstand (90d)"
    icon="sort-down-fill"
    value="18,7%"/>

  <app-icon-value-card
    header="Anteil Nichtleerungen"
    icon="sort-up-fill"
    value="30%"/>
</div>
