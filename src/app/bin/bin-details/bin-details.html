<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-6
    [&_.p-card]:rounded-2xl
    [&_.p-card]:border
    [&_.p-card]:border-surface-300">

  <p-card header="Füllstände" class="col-span-full">
    <p-chart
      type="line"
      [data]="fillLevelData()"
      [options]="fillLevelOptions"
      class="h-64 mt-2" />
  </p-card>

  <p-card>
    <div class="flex flex-col gap-3">
      <div class="flex flex-col">
        <strong>Typ</strong>
        <span>{{ bin().type }}</span>
      </div>

      <div class="flex flex-col">
        <strong>Koordinaten</strong>

        <div class="flex gap-3">
          <div>
            <strong>X:</strong><span class="ml-1">{{ bin().coordX }}</span>
          </div>
          <div>
            <strong>Y:</strong><span class="ml-1">{{ bin().coordY }}</span>
          </div>
        </div>
      </div>
    </div>
  </p-card>

  <p-card header="Standort" class="2xl:col-span-2">
    <div class="h-64">
      <google-map
        height="100%"
        width="100%"
        [center]="binPosition()"
        [options]="mapOptions">
        <map-advanced-marker
          [position]="binPosition()"/>
      </google-map>
    </div>
  </p-card>
</div>
