<div class="mb-6 flex items-end justify-between gap-6"> <!-- TODO maybe outsource to dedicated header component -->
  <div class="flex items-end gap-4">
    <h2 class="text-7xl font-extrabold tracking-tight text-gray-600">Behälter</h2>
    @if (loading() || locationLoading()) {
      <p-skeleton width="14rem" height="2rem" />
    } @else {
      <p class="text-2xl font-black tracking-tight text-gray-500">{{ locationLabel() }}</p>
    }
  </div>
  <p-button
    severity="secondary"
    [outlined]="true"
    icon="pi pi-arrow-left"
    label="Zurück"
    (onClick)="goBack()" />
</div>

<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 auto-rows-fr gap-6
    [&_.p-card]:h-full
    [&_.p-card]:rounded-2xl
    [&_.p-card]:border
    [&_.p-card]:border-surface-300">

  <p-card header="Füllstand-Trend" class="col-span-full">
    @if (loading()) {
      <p-skeleton height="16rem"/>
    } @else {
      <p-chart
        type="line"
        [data]="fillLevelData()"
        [options]="fillLevelOptions"
        class="h-64 mt-2" />
    }
  </p-card>

  <p-card>
    @if (loading()) {
      <div class="flex flex-col gap-3">
        <p-skeleton width="10rem" height="1.5rem" /> <!-- TODO mabe show skeleton below labels -->
        <p-skeleton width="14rem" height="1.5rem" />
        <p-skeleton width="12rem" height="1.5rem" />
      </div>
    } @else {
      <div class="flex flex-col gap-3">
        <div class="flex flex-col">
          <strong>Typ</strong>
          <span>{{ bin()?.binType }}</span>
        </div>

        <div class="flex flex-col">
          <strong>Koordinaten</strong>

          <div class="flex gap-3">
            <div>
              <strong>X:</strong><span class="ml-1">{{ bin()?.coordX2056 }}</span>
            </div>
            <div>
              <strong>Y:</strong><span class="ml-1">{{ bin()?.coordY2056 }}</span>
            </div>
          </div>
        </div>

        <div class="flex flex-col">
          <strong>Strasse</strong>
          <span>{{ locationLabel() }}</span>
        </div>
      </div>
    }
  </p-card>

  <p-card header="Standort">
    <div class="h-64">
      @if (loading()) {
        <p-skeleton height="100%"/>
      } @else {
        <google-map
          height="100%"
          width="100%"
          [center]="binPosition()"
          [options]="mapOptions">
          <map-advanced-marker
            [position]="binPosition()" />
        </google-map>
      }
    </div>
  </p-card>

  <app-trend-metric-card
    header="⌀ wöchentliche Besuche (letzte 90 Tage)"
    [loading]="loading()"
    [value]="bin()?.binDayFeaturesResponse?.baselineAvgVisitsPerWeek90d ?? 0" /> <!-- TODO trend? -->

  <app-trend-metric-card
    header="⌀ wöchentliche Leerungen (letzte 90 Tage)"
    [loading]="loading()"
    [value]="bin()?.binDayFeaturesResponse?.baselineAvgEmptyingsPerWeek90d ?? 0" /> <!-- TODO trend? -->

  <app-simple-metric-card
    header="Rang nach Leerungen (letzte 90 Tage)"
    icon="list"
    [loading]="loading()"
    [value]="bin()?.binDayFeaturesResponse?.emptyingRank90d ?? 0" />

  <app-simple-metric-card
    header="Wetter Sensitivität"
    icon="sun"
    [loading]="loading()"
    [value]="bin()?.binDayFeaturesResponse?.weatherSensitivityScore ?? 0" />

  <app-simple-metric-card
    header="Event Sensitivtät"
    icon="calendar"
    [loading]="loading()"
    [value]="bin()?.binDayFeaturesResponse?.eventSensitivityScore ?? 0" />

  <app-simple-metric-card
    header="Anteil Besuche mit niedrigem Füllstand (90d)"
    icon="sort-down-fill"
    [loading]="loading()"
    [value]="bin()?.binDayFeaturesResponse?.lowFillVisitRatio90d ?? 0"
    [percent]="true" />

  <app-simple-metric-card
    header="Anteil Nichtleerungen"
    icon="sort-up-fill"
    [loading]="loading()"
    [value]="bin()?.binDayFeaturesResponse?.notEmptiedRatio90d ?? 0"
    [percent]="true" />
</div>
