<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-6
    [&_.p-card]:rounded-2xl
    [&_.p-card]:border
    [&_.p-card]:border-surface-300">

  <p-card>
    <div class="flex flex-col gap-3">
      <div class="flex flex-col">
        <strong>ID</strong>
        <span>{{ tour().id }}</span>
      </div>

      <div class="flex flex-col">
        <strong>Datum</strong>
        <span>{{ tour().startedAt | chDateTime }}</span>
      </div>

    </div>
  </p-card>

  <p-card
    header="Zeitleiste"
    [class.col-span-2]="timelineWithMueve() && tour().vehicleEmptyings.length > 2">
    <div class="flex flex-col justify-between h-64">
      <div class="flex flex-col mt-8">
        <p-timeline
          layout="horizontal"
          align="left"
          [value]="timeline()">
          <ng-template #opposite let-event>
            <div class="flex justify-start w-full">
              <small class="text-surface-500">
                {{ event.action }}
              </small>
            </div>
          </ng-template>

          <ng-template #content let-event>
            {{ event.timestamp | chDateTime: 'time' }}
          </ng-template>
        </p-timeline>
      </div>

      <p-toggle-button
        [ngModel]="timelineWithMueve()"
        (ngModelChange)="timelineWithMueve.set($event)"
        onLabel="Mit Müve"
        offLabel="Mit Müve"
        class="w-fit" />
    </div>
  </p-card>

  <p-card header="Mülleimer besucht">
    <div class="relative min-h-56">
      <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
        <div class="mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-red-500/15">
          <i class="pi pi-eye text-3xl text-red-400"></i>
        </div>

        <div class="text-6xl font-extrabold leading-none tracking-tight">
          {{ tour().binVisits.length }}
        </div>
      </div>
    </div>
  </p-card>

  <p-card header="Mülleimer geleert">
    <div class="relative min-h-56">
      <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
        <div class="mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-red-500/15">
          <i class="pi pi-trash text-3xl text-red-400"></i>
        </div>

        <div class="text-6xl font-extrabold leading-none tracking-tight">
          {{ emptyingsCount() }}
        </div>
      </div>
    </div>
  </p-card>

  <p-card header="Füllstandverteilung" class="rounded-lg">
    <p-chart
      type="pie"
      [data]="fillLevelPieData()"
      [options]="fillLevelPieOptions"
      class="relative h-64 mt-4" />
  </p-card>

  <p-card header="Übervolle Mülleimer">
    <div class="relative min-h-56">
      <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
        <div class="mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-red-500/15">
          <i class="pi pi-exclamation-circle text-3xl text-red-400"></i>
        </div>

        <div class="text-6xl font-extrabold leading-none tracking-tight">
          {{ overfullBins() }}
        </div>
      </div>
    </div>
  </p-card>
</div>
