<div class="flex flex-col h-screen">
  <p-toolbar>
    <div class="p-toolbar-group-start">
      <h1 class="text-lg font-semibold ml-2">DDWM BI</h1>
    </div>
  </p-toolbar>
  <div class="flex h-full">
    <div class="flex flex-col">
      <div class="w-64 p-4">
        <p-menu [model]="navItems" class="custom-menu"></p-menu>
      </div>
      <div class="w-64 p-4">
        <p-menu [model]="linkItems" class="custom-menu"></p-menu>
      </div>
    </div>
    <div class="flex-1" [ngClass]="routePaddingClass()">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>

<p-toast position="top-right"></p-toast>
